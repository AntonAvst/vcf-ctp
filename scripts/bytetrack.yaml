# Ultralytics ByteTrack config (compatible with 8.3+)
tracker_type: bytetrack

# Detection score thresholds
track_high_thresh: 0.5        # high-score dets used in first association
track_low_thresh: 0.1         # low-score rescue pass
new_track_thresh: 0.6         # threshold to start a brand new track

# Association / lifecycle
match_thresh: 0.8             # IoU gating for matching
track_buffer: 30              # REQUIRED: max frames to keep a lost track (≈ 2–3s @ 10–15 FPS)
max_age: 45                   # hard cap on how long to keep lost tentative tracks
min_hits: 3                   # frames to confirm a track

# Misc
min_box_area: 10
fuse_score: true
mot20: false
iou_camera_motion: false
