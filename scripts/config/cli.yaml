# ═════════════════════════════════════════════════════════════════════════════
# cli.yaml — how scripts RUN and what QA output they produce.
# Nothing here changes pipeline results (that is params.yaml).
#
# Every key is required; unknown keys are errors. Validate: python3 config.py
#
# Still on the command line (per-invocation, never in a file):
#   input/identity    track_and_dump --source, display_tracks --video --session_id,
#                     reconcile --session, assign_identity --session
#   operations        assign_identity --assign/--remove/--list/--note/--run_reconcile,
#                     drive_manager <command>, calving_ledger_ingest --file/--farm/
#                     --overwrite, match_identity --tracks/--kinetics/--output/--scores_json
#   safety one-shots  --dry_run, --bypass_upload_check
#   config override   --params my_params.yaml
#
# Relative paths resolve against the scripts directory; "~" is expanded.
# ═════════════════════════════════════════════════════════════════════════════

track_and_dump:
  save_crops: false
  crops_local: false        # keep crops local only (no Drive upload); needs save_crops
  crop_tags: false          # append _<posture>_<facing> to crop names; needs a pose model
  crop_every: 1             # save every N-th sample per temp_id (counts samples, not frames)
  min_crop_wh: [0, 0]       # [W, H] minimum crop size to save
  save_masks: false         # QA mask polygons → outputs/<sid>/qa_masks/, never uploaded

display_tracks:
  port: 5000
  start: 0                  # first frame
  limit: 0                  # stop after N frames (0 = whole video)
  draw_pose: false
  draw_masks: false         # needs track_and_dump save_masks: true first
  kp_radius: 3
  sk_thickness: 2
  kp_thresh: 0.0            # hide keypoints with visibility <= this
  hide_occluded: false
  kp_conf_thresh: 0.30      # display filter only — independent of params pose.kp_conf_thresh
  show_lowconf: false
  kp_index: false           # draw keypoint index numbers
  kp_index_scale: 0.45
  kp_index_thickness: 1
  kp_index_offset: 6

metrics_export:
  out: ../metrics/metrics.json
  watch: false
  pretty: true

storage:
  rclone_remote: thesis_google_drive        # from `rclone listremotes`
  drive_folder: vcf_ctp_data                # Drive root = <remote>:<folder>
  local_root: ~/thesis_workspace/vcf-ctp/data
  buffer_dir: ~/thesis_workspace/vcf-ctp/.buffer
  max_attempts: 5                           # upload attempts before 'abandoned'
  backoff_base: 2                           # in-session retry waits: base^(2·attempt) s
